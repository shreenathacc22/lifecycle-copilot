# http level: /etc/nginx/conf.d/waitlist-zone.conf. Owner: devops.
# Keyed on $binary_remote_addr. Inside the /api/waitlist location, real_ip has
# already replaced it with the visitor IP from CF-Connecting-IP (see nginx-server.conf).
limit_req_zone $binary_remote_addr zone=waitlist:1m rate=5r/m;

# 429 body picked like the app does (waitlist/app.py): JSON only when the client asks
# for JSON and not HTML (the landing page's fetch); everyone else gets the HTML page.
# Regexes are checked in order.
map $http_accept $waitlist_429 {
    "~*text/html"         /waitlist-429.html;
    "~*application/json"  /waitlist-429.json;
    default               /waitlist-429.html;
}

# server level: /etc/nginx/default.d/waitlist.conf (included in the port 80 server). Owner: devops.
#
# Visitor IP: real_ip is set ONLY in the /api/waitlist location. Applied site-wide, it would
# put visitor IPs in the main access log, and the privacy policy says that log
# usually holds a Cloudflare address.
# A forged CF-Connecting-IP can't get in, for two separate reasons:
#   1. The security group allows ports 80/443 only from Cloudflare's ranges, so a direct-to-origin request never reaches nginx.
#   2. set_real_ip_from trusts the header only when the connecting address is a Cloudflare range,
#      so if the SG were ever opened, a direct request would be keyed on its own address.
# Cloudflare overwrites any client-supplied CF-Connecting-IP at the edge.
# Ranges from https://www.cloudflare.com/ips (checked 24-Oct-2026: 15 v4, 7 v6). Keep in sync with the SG.

# POST only, 5 a minute per visitor: the first 5 quick requests pass, the 6th gets 429 (W-A9)
location = /api/waitlist {
    # security headers (qa review): `always` puts them on 4xx/5xx too, including nginx's own 405, 413 and 429.
    # CSP fits dev's no-JS result page (waitlist/form.py): one inline <style>, Google Fonts, the form posts to self, no scripts.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    if ($request_method != POST) { return 405; }
    include /etc/nginx/waitlist-cf-realip.conf;
    limit_req zone=waitlist burst=4 nodelay;
    limit_req_status 429;
    error_page 429 $waitlist_429;      # status stays 429; body from the internal locations below
    client_max_body_size 4k;

    # no waitlist IPs in logs (W4): no access log, and the error log only at crit,
    # because limit_req rejections and upstream errors log "client: <ip>" at error level
    access_log off;
    error_log /var/log/nginx/error.log crit;

    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # the app never sees visitor IPs (W4)
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

location = /api/waitlist/health {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    if ($request_method != GET) { return 405; }
    access_log off;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 5s;
}

# Rate-limit pages, internal only (no direct URL). Files: deploy/waitlist/errors/ -> /usr/share/nginx/waitlist-errors/
# add_header isn't carried across the internal redirect, so the security headers are repeated here.
location = /waitlist-429.html {
    internal;
    root /usr/share/nginx/waitlist-errors;
    access_log off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
}

location = /waitlist-429.json {
    internal;
    root /usr/share/nginx/waitlist-errors;
    access_log off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
}
